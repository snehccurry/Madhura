# Tests on Linux (Python 3.10 + 3.13) and Windows; the Windows build (PyInstaller, one folder,
# zipped) on pushes to main, v* tags and manual runs; a GitHub release with that zip for v* tags.
#
# Every build is checked with `Madhura.exe --self-test`: a headless run of the whole app on a
# throwaway data folder that fails when a module, page or asset is missing (madhura/selftest.py).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  QT_QPA_PLATFORM: offscreen
  MADHURA_NO_SOUND: "1"

jobs:
  test:
    name: Tests (Linux, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest -q

      - name: Self-test
        run: python -m madhura --self-test

      # Catches spec / hidden-import / asset regressions on pull requests too (the Windows build
      # below only runs for main, tags and manual runs).
      - name: Frozen build smoke test
        if: matrix.python-version == '3.13'
        run: |
          pyinstaller --noconfirm --log-level WARN madhura.spec
          dist/Madhura/Madhura --self-test

  test-windows:
    name: Tests (Windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Core logic, data, engine, platform integration, services and packaging. The widget-level
      # UI tests run on Linux, where the offscreen platform's fonts and metrics are stable.
      - name: Run the platform tests
        run: >-
          python -m pytest -q
          tests/test_core_checkins.py
          tests/test_core_clock_days.py
          tests/test_core_models.py
          tests/test_core_no_wallclock.py
          tests/test_core_nudges_streaks.py
          tests/test_core_paths.py
          tests/test_core_platform.py
          tests/test_core_timefmt.py
          tests/test_d_packaging.py
          tests/test_data_backup.py
          tests/test_data_db.py
          tests/test_data_repository.py
          tests/test_data_settings.py
          tests/test_engine.py
          tests/test_engine_restore.py
          tests/test_h_core_habits.py
          tests/test_i_analytics.py
          tests/test_i_export.py
          tests/test_s_autostart.py
          tests/test_s_legacy_import.py
          tests/test_services_notifier_attention.py
          tests/test_services_single_instance.py
          tests/test_services_sound.py

      - name: Self-test
        run: python -m madhura --self-test

  build-windows:
    name: Windows build
    needs: [test, test-windows]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm madhura.spec

      # Madhura.exe is a windowed (GUI) program: Start-Process -Wait is what waits for it and
      # reports its exit code. The report lists every check.
      - name: Self-test the build
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "self-test.txt"
          $proc = Start-Process -FilePath "dist\Madhura\Madhura.exe" -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($proc.ExitCode -ne 0) { throw "Madhura.exe --self-test failed (exit code $($proc.ExitCode))" }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = python -c "import madhura; print(madhura.__version__)"
          if ($env:GITHUB_REF -like "refs/tags/v*" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match madhura.__version__ ($version)"
          }
          $info = (Get-Item "dist\Madhura\Madhura.exe").VersionInfo
          $info | Format-List FileDescription, ProductName, FileVersion, ProductVersion, LegalCopyright
          if ($info.FileDescription -ne "Madhura" -or $info.ProductVersion -ne $version) {
            throw "Unexpected version resource on Madhura.exe"
          }
          $name = "Madhura-$version-windows-x64"
          python -c "import shutil, sys; print(shutil.make_archive(sys.argv[1], 'zip', 'dist', 'Madhura'))" $name
          "artifact=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}.zip
          if-no-files-found: error
          compression-level: 0  # already a zip

  release:
    name: GitHub release
    needs: build-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.artifact }}
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
